# The library is the root package; the Next.js, Nuxt and SvelteKit demos are
# separate projects (their own build systems) wired in as workspace members so a
# single `pnpm install` covers everything and the demos consume the lib via
# `glyphnav: workspace:*`. The Vite-based demos (vanilla, Vue, React, TanStack,
# Angular) are NOT separate packages — they live in the root package's demo/.
packages:
  - 'demo/shared'
  - 'demo/next'
  - 'demo/nuxt'
  - 'demo/sveltekit'
autoInstallPeers: true
strictPeerDependencies: false
# Pin dependencies to exact versions on `pnpm add` (ranges are reserved for
# peerDependencies, which are edited by hand).
saveExact: true
# @sveltejs/kit is auto-installed at the root only to satisfy the lib's own
# optional peer (adapter types); its typescript peer range tops out at ^6 while
# the root runs the Go-native typescript@7 for `tsc`. The actual SvelteKit demo
# workspace supplies typescript 6.x. Drop when kit allows TS 7.
peerDependencyRules:
  allowedVersions:
    '@sveltejs/kit>typescript': '7'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # sharp ships prebuilt binaries; the demos don't process images (Next uses
  # images.unoptimized), so its postinstall build script isn't needed.
  sharp: false
minimumReleaseAgeExclude:
  - '@angular/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vitejs/plugin-react'
  - '@vue/language-core'
  - oxfmt
  - oxlint
  - preact-iso
  - react-router
  - vue-tsc
