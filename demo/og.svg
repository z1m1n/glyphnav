<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source for the social / link-preview card (demo/public/og.png).
    Regenerate the PNG after editing:  node demo/render-og.mjs   (needs `sharp`)
    Monospace look matches the demo site: #111 ink, #0000ee links, white bg.
  -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="6" fill="#111111"/>

  <g font-family="DejaVu Sans Mono, monospace">
    <!-- faux address bar, mid-decode -->
    <rect x="270" y="74" width="660" height="62" rx="31" fill="#fafafa" stroke="#dddddd" stroke-width="1.5"/>
    <circle cx="312" cy="105" r="11" fill="none" stroke="#999999" stroke-width="1.6"/>
    <line x1="301" y1="105" x2="323" y2="105" stroke="#999999" stroke-width="1.6"/>
    <path d="M312 94 q7 11 0 22 q-7 -11 0 -22" fill="none" stroke="#999999" stroke-width="1.6"/>
    <text x="344" y="114" font-size="27" letter-spacing="0.5">
      <tspan fill="#555555">z1m1n.github.io/</tspan><tspan fill="#111111">glyph</tspan><tspan fill="#bbbbbb">z9#</tspan>
    </text>
    <rect x="735" y="90" width="11" height="30" rx="1.5" fill="#0000ee"/>

    <!-- wordmark -->
    <text x="600" y="352" text-anchor="middle" font-size="132" font-weight="bold" fill="#111111" letter-spacing="-2">glyphnav</text>

    <!-- tagline -->
    <text x="600" y="432" text-anchor="middle" font-size="31" fill="#555555">animate the URL in the address bar &#8212; glyph by glyph</text>

    <!-- footer -->
    <line x1="80" y1="520" x2="1120" y2="520" stroke="#eeeeee" stroke-width="1.5"/>
    <text x="80" y="566" font-size="26" fill="#888888">$ npm i glyphnav</text>
    <text x="1120" y="566" text-anchor="end" font-size="22" fill="#999999">vue &#183; react &#183; tanstack &#183; angular &#183; next &#183; nuxt</text>
  </g>
</svg>
