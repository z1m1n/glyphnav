name: Deploy demo to GitHub Pages

# Builds demo/ and publishes it to GitHub Pages on every push to the default
# branch (and on demand). See .github/DEPLOY_DEMO.txt for the one-time repo
# setup this needs.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token plus the OIDC + Pages scopes the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build demo
        # A GitHub project page is served under /<repo>/, so the demo must be
        # built with that base. Deriving it from the repo name keeps forks and
        # renames working. For a custom domain or user/org page, set this to "/".
        #
        # `demo:build` orchestrates every demo build: the Vite playground (vanilla,
        # Vue, React, TanStack, Angular) plus the standalone Next.js and Nuxt
        # workspace projects, which are statically exported and copied into
        # demo/dist/{next,nuxt}. DEMO_BASE is threaded through all of them.
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: pnpm demo:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
