name: Publish to npm

# Publishes the package to npm when a GitHub Release is published. The release
# tag (e.g. v0.1.1) should match the "version" in package.json. One-time setup
# (the NPM_TOKEN secret) is documented in .github/PUBLISH_NPM.txt.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          install: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/validate-release.mjs

      - run: pnpm install --frozen-lockfile --no-runtime

      # Quality gate — never publish a red build. `check` runs the full gate
      # (typecheck across the library, its tooling configs and every demo; lint
      # and tsrs-backed TypeScript diagnostics; format check; tests).
      - run: pnpm run check
      - run: pnpm run test:package

      # `prepublishOnly` runs the production build before packing. `--provenance`
      # needs the id-token permission above and a public repo; `--no-git-checks`
      # keeps pnpm from refusing to publish from the release's detached checkout.
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          pnpm_config__auth: '{"https://registry.npmjs.org":{"@":{"authToken":"${NODE_AUTH_TOKEN}"}}}'
